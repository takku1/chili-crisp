[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chilicrisp"
version = "0.1.0"
description = "Design against an imagined machine, verify on a real one"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<5", "psutil>=7.2,<8"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "twine>=6,<7", "ruff>=0.14,<1"]

[project.scripts]
chilicrisp = "chilicrisp.__main__:main"
chili-runner = "chilicrisp.runner:main"
chili-frontier = "chilicrisp.controller:main"
chili-recover = "chilicrisp.recovery:main"

[tool.setuptools.packages.find]
include = ["chilicrisp*"]
namespaces = false

[tool.setuptools.package-data]
chilicrisp = ["schemas/*.schema.json", "skills/chili-dev/SKILL.md", "skills/chili-dev/manifest.json", "skills/chili-dev/flows/*.md", "skills/chili-dev/agents/*.yaml"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["chilicrisp/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
