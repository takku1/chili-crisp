name: Package and portable contracts
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,evolution]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m build --outdir artifacts/packages
      - run: python -m twine check artifacts/packages/*
      - run: python tools/check-wheel.py --dist artifacts/packages
